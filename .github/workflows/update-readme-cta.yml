name: Update README CTA

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-readme-cta.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Replace click badges with handwritten CTA
        shell: python
        run: |
          from pathlib import Path

          path = Path("README.md")
          text = path.read_text(encoding="utf-8")

          old = '<a href="https://othmanayari049-wq.github.io/othmanayari049-wq/contact.html"><img src="https://img.shields.io/badge/CLICK%20HERE-%E2%86%92-FF2D55?style=for-the-badge" alt="Click here to send a research or internship inquiry" /></a>'
          new = '<a href="https://othmanayari049-wq.github.io/othmanayari049-wq/contact.html"><img src="https://raw.githubusercontent.com/othmanayari049-wq/othmanayari049-wq/main/assets/click-me-handwritten.svg" width="240" alt="Psst... click me to send a research or internship inquiry" /></a>'

          if old not in text:
              raise SystemExit("Expected CLICK HERE badge not found; README was not changed.")

          text = text.replace(old, new)
          path.write_text(text, encoding="utf-8")

      - name: Commit README update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet && exit 0
          git commit -m "style: make inquiry CTA playful and handwritten"
          git push
